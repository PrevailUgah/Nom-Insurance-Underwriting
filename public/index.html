<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nom Insurance Underwriting</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Nom Insurance Underwriting System</h1>
      <p>Real-time Property & Casualty Risk Evaluation Engine</p>
    </header>

    <main>
      <form id="underwriting-form">
        <div class="form-group">
          <label for="assetType">Asset Type</label>
          <select id="assetType" name="assetType">
            <option value="Property">Property / Real Estate</option>
            <option value="Vehicle">Vehicle / Auto</option>
          </select>
        </div>

        <div class="form-group">
          <label for="assetValue">Replacement Value (₦)</label>
          <input type="number" id="assetValue" name="assetValue" value="25000000" required>
        </div>

        <div class="form-group">
          <label for="claimsHistory">5-Year Claims History</label>
          <input type="number" id="claimsHistory" name="claimsHistory" value="0" min="0" required>
        </div>

        <button type="submit" id="submit-btn">Evaluate Risk</button>
      </form>

      <div id="result-card" class="result-card">
        <p>Submit details above to view live risk analysis.</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
