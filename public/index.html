<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nom Insurance - Underwriting Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Dark Blue Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>Nom Insurance Underwriting</h1>
            <p>P&C Automated Risk Evaluation & Database Persistence Portal</p>
        </header>

        <!-- Main Form Card -->
        <main class="card">
            <form id="underwritingForm">
                <div class="form-grid">
                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="e.g. Jane Doe" required>
                    </div>

                    <!-- Email Address -->
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="e.g. jane@example.com" required>
                    </div>

                    <!-- Phone Number -->
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="e.g. +1 555-0199" required>
                    </div>

                    <!-- Asset Type -->
                    <div class="form-group">
                        <label for="assetType">Asset Type</label>
                        <select id="assetType" name="assetType" required>
                            <option value="" disabled selected>Select Asset Type</option>
                            <option value="Residential">Residential Property</option>
                            <option value="Commercial">Commercial Real Estate</option>
                            <option value="Industrial">Industrial Facility</option>
                            <option value="Vehicle">Vehicle Fleet</option>
                        </select>
                    </div>

                    <!-- Replacement Value -->
                    <div class="form-group">
                        <label for="replacementValue">Replacement Value ($)</label>
                        <input type="number" id="replacementValue" name="replacementValue" placeholder="e.g. 250000" min="0" required>
                    </div>

                    <!-- Asset Age -->
                    <div class="form-group">
                        <label for="assetAge">Asset Age (Years)</label>
                        <input type="number" id="assetAge" name="assetAge" placeholder="e.g. 5" min="0" required>
                    </div>

                    <!-- Claims History -->
                    <div class="form-group">
                        <label for="claimsHistory">Past Claims (5 Yrs)</label>
                        <input type="number" id="claimsHistory" name="claimsHistory" placeholder="e.g. 0" min="0" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">Submit Underwriting Request</button>
            </form>
        </main>
    </div>

    <!-- Output / Decision Modal -->
    <div id="aiModal" class="modal-overlay hidden">
        <div class="modal-content">
            <span id="decisionBadge" class="badge">Approved & Saved to Neon</span>
            <h2>Underwriting Decision</h2>
            
            <div class="results-display">
                <div class="result-row">
                    <span>Risk Score:</span>
                    <span id="riskScore" class="result-value">--</span>
                </div>
                <div class="result-row">
                    <span>Risk Multiplier:</span>
                    <span id="multiplier" class="result-value">--</span>
                </div>
                <div class="result-row">
                    <span>Calculated Premium:</span>
                    <span id="calculatedPremium" class="result-value">$0.00</span>
                </div>
            </div>

            <button id="closeModalBtn" class="btn-submit" style="margin-top: 0;">Close Window</button>
        </div>
    </div>

    <!-- Client-Side Script -->
    <script src="app.js"></script>
</body>
</html>
