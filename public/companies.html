<!-- inside the companies section -->
<div id="companiesContainer" class="grid ... your existing grid classes ..."></div>

<script>
async function loadPublicCompanies() {
  const res = await fetch('/api/companies');
  const data = await res.json();
  if (!data.success) return;

  const container = document.getElementById('companiesContainer');
  container.innerHTML = data.companies.map(c => `
    <div class="... your existing card classes ...">
      ${c.is_coming_soon ? '<span class="...">COMING SOON</span>' : ''}
      <div class="...">${c.short_code || ''}</div>
      <div class="...">${c.rating || ''}</div>
      <h3>${c.name}</h3>
      <p>${c.description || ''}</p>
      <ul>${(c.specialties || []).map(s => `<li>✓ ${s}</li>`).join('')}</ul>
      <a href="form.html" class="...">Insure with ${c.name.split(' ')[0]}</a>
    </div>
  `).join('');
}
document.addEventListener('DOMContentLoaded', loadPublicCompanies);
</script>
