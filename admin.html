<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoTrust Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
    <style>
        body {
            background: #0a1628;
            color: #e2e8f0;
        }

        .glass {
            background: rgba(15, 30, 60, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .tab-active {
            border-bottom: 2px solid #3b82f6;
            color: #60a5fa;
        }
    </style>
</head>

<body class="min-h-screen">
    <!-- Login / Passkey Gate -->
    <div id="gate" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass rounded-2xl p-8 w-full max-w-md space-y-6">
            <h1 class="text-2xl font-bold text-center text-blue-400">Admin Access</h1>

            <div id="loginSection">
                <input id="loginEmail" type="email" placeholder="Admin email"
                    class="w-full mb-3 px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-blue-500" />
                <input id="loginPassword" type="password" placeholder="Password"
                    class="w-full mb-3 px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-blue-500" />
                <button onclick="doLogin()"
                    class="w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-500 font-semibold">Login</button>
                <p class="text-sm text-center mt-3 text-slate-400">First time? <button onclick="showSignup()"
                        class="text-blue-400">Sign up</button></p>
            </div>

            <div id="signupSection" class="hidden">
                <input id="signupName" type="text" placeholder="Full name"
                    class="w-full mb-3 px-4 py-3 rounded-lg bg-slate-900 border border-slate-700" />
                <input id="signupEmail" type="email" placeholder="Email"
                    class="w-full mb-3 px-4 py-3 rounded-lg bg-slate-900 border border-slate-700" />
                <input id="signupPassword" type="password" placeholder="Password (min 6)"
                    class="w-full mb-3 px-4 py-3 rounded-lg bg-slate-900 border border-slate-700" />
                <button onclick="doSignup()"
                    class="w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-500 font-semibold">Create Account</button>
                <p class="text-sm text-center mt-3 text-slate-400"><button onclick="showLogin()"
                        class="text-blue-400">Back to login</button></p>
            </div>

            <div id="passkeySection" class="hidden">
                <p class="text-sm text-slate-300 mb-2">Enter Admin Passkey to continue</p>
                <input id="passkeyInput" type="password" placeholder="Admin Passkey"
                    class="w-full mb-3 px-4 py-3 rounded-lg bg-slate-900 border border-slate-700" />
                <button onclick="verifyPasskey()"
                    class="w-full py-3 rounded-lg bg-emerald-600 hover:bg-emerald-500 font-semibold">Unlock
                    Dashboard</button>
            </div>

            <p id="gateError" class="text-red-400 text-sm text-center hidden"></p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
        <header class="glass border-b border-blue-900/40 px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400">GoTrust Admin</h1>
            <div class="flex items-center gap-4">
                <span id="adminEmail" class="text-sm text-slate-400"></span>
                <button onclick="logout()"
                    class="text-sm px-3 py-1 rounded bg-slate-700 hover:bg-slate-600">Logout</button>
            </div>
        </header>

        <nav class="flex gap-6 px-6 pt-4 border-b border-slate-800">
            <button class="tab-btn tab-active pb-3" data-tab="applications">Applications</button>
            <button class="tab-btn pb-3" data-tab="companies">Companies</button>
            <button class="tab-btn pb-3" data-tab="users">Users</button>
        </nav>

        <main class="p-6">
            <!-- Applications Tab -->
            <div id="tab-applications" class="tab-content">
                <div class="flex gap-3 mb-4">
                    <select id="filterStatus" class="px-3 py-2 rounded bg-slate-900 border border-slate-700">
                        <option value="">All statuses</option>
                        <option value="pending">Pending</option>
                        <option value="reviewed">Reviewed</option>
                        <option value="approved">Approved</option>
                        <option value="declined">Declined</option>
                    </select>
                    <button onclick="loadApplications()"
                        class="px-4 py-2 rounded bg-blue-600 hover:bg-blue-500">Refresh</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="text-left text-slate-400 border-b border-slate-700">
                            <tr>
                                <th class="py-2 pr-4">ID</th>
                                <th class="py-2 pr-4">Name</th>
                                <th class="py-2 pr-4">Email</th>
                                <th class="py-2 pr-4">Asset</th>
                                <th class="py-2 pr-4">Value</th>
                                <th class="py-2 pr-4">Risk</th>
                                <th class="py-2 pr-4">Decision</th>
                                <th class="py-2 pr-4">Status</th>
                                <th class="py-2">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="appsTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- Companies Tab -->
            <div id="tab-companies" class="tab-content hidden">
                <button onclick="showAddCompany()" class="mb-4 px-4 py-2 rounded bg-emerald-600 hover:bg-emerald-500">+
                    Add Company</button>
                <div id="companiesList" class="grid gap-4 md:grid-cols-2"></div>
            </div>

            <!-- Users Tab -->
            <div id="tab-users" class="tab-content hidden">
                <button onclick="loadUsers()"
                    class="mb-4 px-4 py-2 rounded bg-blue-600 hover:bg-blue-500">Refresh</button>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="text-left text-slate-400 border-b border-slate-700">
                            <tr>
                                <th class="py-2 pr-4">Email</th>
                                <th class="py-2 pr-4">Name</th>
                                <th class="py-2 pr-4">Role</th>
                                <th class="py-2 pr-4">Joined</th>
                                <th class="py-2">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Application Review Modal -->
    <div id="reviewModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
        <div class="glass rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl font-bold mb-4 text-blue-400">Review Application</h2>
            <div id="reviewContent" class="space-y-2 text-sm mb-4"></div>
            <label class="block text-sm mb-1">Status</label>
            <select id="reviewStatus" class="w-full mb-3 px-3 py-2 rounded bg-slate-900 border border-slate-700">
                <option value="pending">Pending</option>
                <option value="reviewed">Reviewed</option>
                <option value="approved">Approved</option>
                <option value="declined">Declined</option>
            </select>
            <label class="block text-sm mb-1">Admin Notes</label>
            <textarea id="reviewNotes" rows="3"
                class="w-full mb-4 px-3 py-2 rounded bg-slate-900 border border-slate-700"></textarea>
            <div class="flex gap-3">
                <button onclick="saveReview()" class="flex-1 py-2 rounded bg-blue-600 hover:bg-blue-500">Save</button>
                <button onclick="closeReview()"
                    class="flex-1 py-2 rounded bg-slate-700 hover:bg-slate-600">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Company Modal -->
    <div id="companyModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
        <div class="glass rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <h2 id="companyModalTitle" class="text-xl font-bold mb-4 text-blue-400">Add Company</h2>
            <input id="cName" placeholder="Name *"
                class="w-full mb-3 px-3 py-2 rounded bg-slate-900 border border-slate-700" />
            <input id="cCode" placeholder="Short code (e.g. LA)"
                class="w-full mb-3 px-3 py-2 rounded bg-slate-900 border border-slate-700" />
            <input id="cRating" placeholder="Rating (e.g. A+ Rated)"
                class="w-full mb-3 px-3 py-2 rounded bg-slate-900 border border-slate-700" />
            <textarea id="cDesc" placeholder="Description" rows="2"
                class="w-full mb-3 px-3 py-2 rounded bg-slate-900 border border-slate-700"></textarea>
            <input id="cSpecialties" placeholder="Specialties (comma separated)"
                class="w-full mb-3 px-3 py-2 rounded bg-slate-900 border border-slate-700" />
            <input id="cSort" type="number" placeholder="Sort order" value="0"
                class="w-full mb-3 px-3 py-2 rounded bg-slate-900 border border-slate-700" />
            <label class="flex items-center gap-2 mb-3"><input id="cComingSoon" type="checkbox" /> Coming Soon</label>
            <label class="flex items-center gap-2 mb-4"><input id="cActive" type="checkbox" checked /> Active</label>
            <div class="flex gap-3">
                <button onclick="saveCompany()"
                    class="flex-1 py-2 rounded bg-emerald-600 hover:bg-emerald-500">Save</button>
                <button onclick="closeCompanyModal()"
                    class="flex-1 py-2 rounded bg-slate-700 hover:bg-slate-600">Cancel</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
